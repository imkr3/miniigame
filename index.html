<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="미니게임">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>미니게임</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0b0c10; color: #e5e7eb; -webkit-text-size-adjust: 100%;
      font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 18px 40px; }
    header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.5px; }
    header p { margin: 0 0 24px; color: #9ca3af; }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
      background: #151821; border: 1px solid #232838; border-radius: 16px; padding: 18px; cursor: pointer; color: inherit; font: inherit;
      transition: transform .15s, border-color .15s; overflow: hidden; touch-action: manipulation; }
    .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
    .card:hover { transform: translateY(-3px); border-color: var(--c); }
    .card:active { transform: scale(.98); }
    .card .emoji { font-size: 38px; line-height: 1; margin-bottom: 8px; }
    .card .title { font-size: 18px; font-weight: 700; }
    .card .desc { font-size: 13px; color: #9ca3af; }
    .card .best { margin-top: 10px; font-size: 12px; color: #fbbf24; font-weight: 600; min-height: 1em; }
    footer { margin-top: 32px; font-size: 12px; color: #6b7280; line-height: 1.6; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    #install { display: none; background: #3b82f6; color: #fff; border: 0; border-radius: 999px; padding: 9px 16px;
      font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; flex: none; }
    #install.show { display: block; }
    .ios-tip { display: none; margin: -10px 0 18px; font-size: 13px; color: #93c5fd; }
    .ios-tip.show { display: block; }

    /* 게임 화면: 화면 전체를 쓰는 레이어 */
    #player { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0b0c10;
      height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top); z-index: 10; }
    #player[hidden] { display: none; }
    #stage { flex: 1; min-height: 0; width: 100%; max-width: 900px; margin: 0 auto; }
    @media (min-width: 700px) and (min-height: 640px) { #stage { padding: 0 16px 16px; } #stage .mg-root { border-radius: 14px; } }
    body.playing { overflow: hidden; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🎮 미니게임</h1>
      <p>PC는 키보드·마우스, 모바일은 터치로 플레이할 수 있어요.</p>
    </div>
    <button id="install" type="button">📲 앱으로 설치</button>
  </header>
  <p class="ios-tip" id="iosTip">💡 Safari 공유 버튼 → "홈 화면에 추가"로 앱처럼 쓸 수 있어요.</p>
  <div class="list" id="list"></div>
  <footer>최고 점수는 이 브라우저에 저장됩니다. 한 번 열어두면 오프라인에서도 플레이할 수 있어요.</footer>
</main>
<div id="player" hidden>
  <div id="stage"></div>
</div>
<script type="module">
  import { GAMES, mountGame, getBest } from './src/registry.js';

  const $list = document.getElementById('list');
  const $player = document.getElementById('player');
  const $stage = document.getElementById('stage');
  let current = null;

  function renderList() {
    $list.innerHTML = '';
    for (const g of GAMES) {
      const best = getBest(g.id);
      const btn = document.createElement('button');
      btn.className = 'card';
      btn.style.setProperty('--c', g.color);
      btn.innerHTML = `<span class="emoji">${g.emoji}</span><span class="title">${g.title}</span>
        <span class="desc">${g.desc}</span><span class="best">${best ? `🏆 최고 ${best}` : ''}</span>`;
      btn.onclick = () => { history.pushState({ game: g.id }, '', `#${g.id}`); open(g.id); };
      $list.appendChild(btn);
    }
  }

  async function open(id) {
    const entry = GAMES.find((g) => g.id === id);
    if (!entry) return close();
    current?.destroy();
    document.activeElement?.blur?.();
    document.querySelector('main').inert = true; // 게임 중에는 뒤쪽 목록이 키보드 포커스를 받지 않게
    $player.hidden = false;
    document.body.classList.add('playing');
    current = await mountGame(id, $stage, { fit: true, onExit: goBack, onEvent: (e) => console.debug('[game]', e) });
  }

  function close() {
    current?.destroy();
    current = null;
    document.querySelector('main').inert = false;
    $player.hidden = true;
    document.body.classList.remove('playing');
    renderList();
  }

  function goBack() {
    if (history.state?.game) history.back(); else { history.replaceState(null, '', location.pathname); close(); }
  }
  window.addEventListener('popstate', () => {
    const id = location.hash.slice(1);
    if (GAMES.some((g) => g.id === id)) open(id); else close();
  });

  // 앱 설치 (PWA)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let installEvt = null;
  const $install = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $install.classList.add('show'); });
  $install.onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $install.classList.remove('show'); };
  if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) document.getElementById('iosTip').classList.add('show');

  renderList();
  const fromHash = location.hash.slice(1);
  if (GAMES.some((g) => g.id === fromHash)) open(fromHash);
</script>
</body>
</html>
